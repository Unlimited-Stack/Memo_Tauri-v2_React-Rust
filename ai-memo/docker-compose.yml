version: "3.8"
services:
  dev:
    build: .
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
      - target:/app/src-tauri/target
    ports:
      - "1420:1420"
      - "1421:1421"
    environment:
      - RUST_LOG=info
    command: sh -lc "npm ci && npm run dev -- --host"

  rust-check:
    build: .
    working_dir: /app/src-tauri
    volumes:
      - .:/app
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
      - target:/app/src-tauri/target
    environment:
      - RUST_LOG=info
    command: sh -lc "cargo check"

  http-server:
    build: .
    working_dir: /app/src-tauri
    volumes:
      - .:/app
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
      - target:/app/src-tauri/target
    ports:
      - "1422:1422"
    command: sh -lc "cargo run --bin http_server"

volumes:
  node_modules:
  cargo_registry:
  cargo_git:
  target:
